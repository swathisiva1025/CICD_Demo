# This is a Databricks asset bundle definition for cicd_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cicd_tutorial
  uuid: bd63eb25-b0d5-4e50-94c1-6ac8d9072d21

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    #mode: development
    presets:
       name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-20052540-07d9.cloud.databricks.com
    variables:
      catalog: dev_catalog
      schema: rnd
  prod:
    mode: production
    presets:
       name_prefix: prod_
    workspace:
      host: https://dbc-20052540-07d9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/swathiram93@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/swathiram93@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_catalog
      schema: rnd
    permissions:
      - user_name: swathiram93@gmail.com
        level: CAN_MANAGE
